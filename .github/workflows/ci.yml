name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log || {
            # Failing tests as annotations, readable on the run page without opening the log.
            grep -E "^\s*not ok|error:|expected|actual" test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - run: npm run build
